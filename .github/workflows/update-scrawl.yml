name: Update Scrawl skill

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-scrawl
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out skills
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update and validate
        run: |
          python -m pip install PyYAML
          python scripts/update-scrawl.py
          python scripts/validate.py

      - name: Commit upstream changes
        id: commit
        run: |
          if git diff --quiet -- skills/scrawl; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/scrawl
          git commit -m "chore(scrawl): sync upstream skill"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Refresh Dev Kit catalog
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-dev-kit.yml --ref main
