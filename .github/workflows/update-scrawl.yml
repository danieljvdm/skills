name: Update Scrawl skill

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-scrawl
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: danieljvdm
          repositories: skills
          permission-contents: write

      - name: Check out skills
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update and validate
        run: |
          python -m pip install PyYAML
          python scripts/update-scrawl.py
          python scripts/validate.py

      - name: Commit upstream changes
        run: |
          if git diff --quiet -- skills/scrawl; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/scrawl
          git commit -m "chore(scrawl): sync upstream skill"
          git push origin HEAD:main
